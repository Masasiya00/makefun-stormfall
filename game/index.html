<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stormfall — a top-down battle royale game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f1a'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23a855f7'/%3E%3Ccircle cx='16' cy='12' r='3' fill='%23e9d5ff'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Stormfall: a top-down battle royale. Drop in, loot weapons, outrun the shrinking storm, and be the last one standing. Move with WASD, aim with the mouse, hold click to fire, E to pick up, R to reload, Shift to sprint."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
